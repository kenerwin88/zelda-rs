[workspace]
resolver = "2"
members = [
    "crates/snes",
    "crates/zelda3",
    "crates/platform",
    "crates/assets",
    "crates/renderer",
    "crates/parity",
    "zelda3-bin",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Fast-iteration profile for the parity/replay debug loop: builds far quicker
# than release (no LTO, many codegen units, opt-level 2) while still running
# replays fast enough. Behavior is deterministic regardless of opt-level, so an
# opt-level-2 build compares byte-for-byte against the release reference.
[profile.parity]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
