[package]
name = "renderer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["parity-debug"]
parity-debug = ["zelda3-debug-env/parity-debug"]

[dependencies]
zelda3-debug-env = { path = "../zelda3-debug-env" }
wgpu = "29"
winit = "0.30"
pollster = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
zelda3-dialogue = { path = "../zelda3-dialogue" }
zelda3-palette = { path = "../zelda3-palette" }

[lints]
workspace = true
