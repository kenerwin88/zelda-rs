[package]
name = "parity"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "parity"
path = "src/lib.rs"

[[bin]]
name = "zparity"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
