[package]
name = "rom-shadow-audit"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
rom-shadow-audit = ["snes/rom-timing", "snes/parity-debug"]

[[bin]]
name = "rom-shadow-audit"
path = "src/main.rs"
required-features = ["rom-shadow-audit"]

[[bin]]
name = "rom-retirement-match"
path = "src/matcher_main.rs"
required-features = ["rom-shadow-audit"]

[[bin]]
name = "rom-route-match"
path = "src/route_main.rs"
required-features = ["rom-shadow-audit"]

[[bin]]
name = "rom-audit-stream"
path = "src/stream_main.rs"
required-features = ["rom-shadow-audit"]

[dependencies]
snes = { path = "../snes", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"
bincode = "1"

[lints]
workspace = true
