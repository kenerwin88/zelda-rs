[package]
name = "snes"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Exact cartridge scheduling and external timing-oracle tooling.
rom-timing = []
default = ["parity-debug", "rom-timing"]
parity-debug = ["zelda3-debug-env/parity-debug"]

[dependencies]
zelda3-debug-env = { path = "../zelda3-debug-env" }
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"

[lints]
workspace = true
