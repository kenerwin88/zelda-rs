name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Rust and script checks
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native audio dependencies
        run: brew install opus pkg-config

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check ROM-free packages
        run: cargo check -p snes -p zelda3 -p platform -p renderer -p assets

      - name: Test ROM-free packages
        run: cargo test -p snes -p zelda3 -p platform -p renderer -p assets

      - name: Test audio oracle feature
        run: cargo test -p zelda3 --features audio-oracle

      - name: Create placeholder binary assets
        run: python3 scripts/create_ci_assets.py --out-dir "$GITHUB_WORKSPACE/target/ci-assets/zelda3_assets"

      - name: Check ROM-free binary package
        run: cargo check -p zelda3-bin
        env:
          ZELDA3_ASSETS_DIR: ${{ github.workspace }}/target/ci-assets/zelda3_assets

      - name: Check audio oracle binary and modern-only symbols
        run: python3 scripts/check_audio_build_modes.py
        env:
          ZELDA3_ASSETS_DIR: ${{ github.workspace }}/target/ci-assets/zelda3_assets

      - name: Smoke ROM-free binary package
        run: cargo run -p zelda3-bin -- --standalone-smoke 2
        env:
          ZELDA3_ASSETS_DIR: ${{ github.workspace }}/target/ci-assets/zelda3_assets

      - name: Smoke audio oracle binary package
        run: cargo run -p zelda3-bin --features audio-oracle -- --standalone-smoke 2
        env:
          ZELDA3_ASSETS_DIR: ${{ github.workspace }}/target/ci-assets/zelda3_assets

      - name: Check Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Install Python test dependencies
        run: python3 -m pip install Pillow

      - name: Test compact asset pipeline scripts
        run: |
          PYTHONPATH=scripts python3 scripts/test_rgba_variant_atlas.py
          PYTHONPATH=scripts python3 scripts/test_extract_asset_sources.py
          PYTHONPATH=scripts python3 scripts/test_variant_atlas_summary.py

      - name: Check RAM readability guardrails
        run: python3 scripts/check_ram_readability.py
