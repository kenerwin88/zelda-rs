[package]
name = "zelda3-bin"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "zelda3"
path = "src/main.rs"

[dependencies]
bincode = "1"
snes = { path = "../crates/snes" }
zelda3 = { path = "../crates/zelda3" }
platform = { path = "../crates/platform" }
renderer = { path = "../crates/renderer" }
assets = { path = "../crates/assets" }
parity = { path = "../crates/parity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
pollster = "0.3"
libc = "0.2"

[lints]
workspace = true
