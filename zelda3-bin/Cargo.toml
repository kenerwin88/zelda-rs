[package]
name = "zelda3-bin"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "zelda3"
path = "src/main.rs"

[dependencies]
bincode = "1"
snes = { path = "../crates/snes" }
zelda3 = { path = "../crates/zelda3", default-features = false }
zelda3-compat = { path = "../crates/zelda3-compat" }
platform = { path = "../crates/platform" }
renderer = { path = "../crates/renderer" }
assets = { path = "../crates/assets" }
parity = { path = "../crates/parity" }
zelda3-dialogue = { path = "../crates/zelda3-dialogue" }
zelda3-palette = { path = "../crates/zelda3-palette" }
zelda3-chr = { path = "../crates/zelda3-chr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
pollster = "0.3"
libc = "0.2"

[build-dependencies]
bincode = "1"
png = "0.17"
serde_json = "1"
sha1 = "0.10"
zelda3-chr = { path = "../crates/zelda3-chr" }
zelda3-dialogue = { path = "../crates/zelda3-dialogue" }

[lints]
workspace = true
