[[message]]
id = 53
text = '''[window 02][speed 03][player_name], it is I, Sahasrahla.[line2]I am communicating to you[line3]across the void through[wait_key][scroll]telepathy[...]  The place where[scroll]you now stand was the Golden[scroll]Land, but evil power turned it[wait_key][scroll]into the Dark World.  The[scroll]wizard has broken the wise[scroll]men's seal and opened a gate[wait_key][scroll]to link the worlds[scroll]at Hyrule Castle.  In[scroll]order to save this half of the[wait_key][scroll]world, the Light World, you[scroll]must win back the Golden[scroll]Power.  You must also rescue[wait_key][scroll]the seven maidens who Agahnim[scroll]sent to the Dark World.  As[scroll]members of the blood-line of[wait_key][scroll]the seven wise men, they have[scroll]power that will surely help you.[scroll]The maidens are locked in[wait_key][scroll]hidden dungeons full of evil[scroll]creatures and dangerous traps.[scroll]The Palace of Darkness should[wait_key][scroll]be your first goal in this world![sound 2d][scroll][player_name], I can rely on only[scroll]you.  Please make this old[wait_key][scroll]man's wishes come true.[scroll]I beg you!'''

[[message]]
