id = 14
text = '''Unnh[...] [player_name], I didn't want[line2]you involved in this[...]  I told[line3]you not to leave the house[...][wait_key][scroll]Take my sword and shield and[scroll]listen.  You can focus power in[scroll]the blade (hold the [B] Button).[wait_key][scroll][...]Then release it using the[scroll]secret technique handed down[scroll]by our people[...][wait_key][scroll][player_name], you can do it![scroll]Save the Princess[...][scroll]Zelda is your[...] [...] [...]'''

