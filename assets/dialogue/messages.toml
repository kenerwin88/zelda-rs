[[message]]
id = 56
text = '''Oh!?  You got the Pendant Of[line2]Courage!  Now I will tell you[line3]more of the legend[...][wait_key][scroll]Three or four generations ago,[scroll]an order of knights protected[scroll]the royalty of the Hylia.[wait_key][scroll]These Knights Of Hyrule were[scroll]also guardians of the Pendant[scroll]Of Courage.[wait_key][scroll]Unfortunately, most of them[scroll]were destroyed in the great[scroll]war against evil that took[wait_key][scroll]place when the seven wise men[scroll]created their seal.  Among the[scroll]descendants of the Knights Of[wait_key][scroll]Hyrule a hero must appear.[scroll][...]I see.  [player_name], I believe you.[scroll]You should get the remaining[wait_key][scroll]Pendants.[scroll]And carry this with you.[scroll]This is a treasure passed down[wait_key][scroll]by the families of the wise[scroll]men.  I want you to have it.'''

