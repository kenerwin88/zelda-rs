[[message]]
id = 23
text = '''Princess Zelda, you are safe![line2]Is this your doing, [player_name]?'''

[[message]]
id = 24
text = '''I sense that a mighty evil[line2]force guides the wizard's[line3]actions and augments his[wait_key][scroll]magical power.  The only[scroll]weapon potent enough to[scroll]defeat the wizard is the[wait_key][scroll]legendary Master Sword.[scroll]It is said that the village elder[scroll]is a descendant of one of the[wait_key][scroll]seven wise men.  Maybe[scroll]he can tell you more[...][scroll]I will mark his house on your[wait_key][scroll]map.  But watch your every[scroll]move!  I am certain that the[scroll]castle soldiers will be looking[wait_key][scroll]for you now!  [...]    [...]    [...][sound 2d][scroll]I will hide Princess Zelda here.[scroll]Do not worry!  Seek the elder![wait_key][scroll][...]    [...]    [...][scroll]Do you understand?[scroll]    > Yes[scroll]       Not at all[choose]'''

[[message]]
id = 25
text = '''If you defeat the wizard, the[line2]soldiers may regain[line3]their sanity.[wait_key][scroll]Go, seek the Pendants!'''

[[message]]
id = 26
text = '''Take the three Pendants into[line2]the Lost Woods.  The Master[line3]Sword awaits you there.'''

[[message]]
id = 27
text = '''[player_name]!  You are a second too[line2]late.  I have failed[...] Zelda[...][line3]The soldiers have[wait_key][scroll]abducted her.[scroll]They have taken her to[scroll]the castle.[wait_key][scroll]You must find her before the[scroll]wizard works his magic.[scroll]Please[...]You are our only hope[...]'''

[[message]]
id = 28
text = '''Thank you, [player_name].  I had a[line2]feeling you were getting close.'''

[[message]]
id = 29
text = '''Yes, it was [player_name] who helped[line2]me escape from the dungeon![line3]When I was captive the wizard[wait_key][scroll]said, "Once I have finished with[scroll]you, the final one, the seal of[scroll]the wise men will open."[wait_key][scroll][...]    [...]    [...][scroll][player_name], you must not let the[scroll]land of Hyrule fall into the[wait_key][scroll]wizard's clutches.[scroll]If he releases the seal of the[scroll]seven wise men, evil power will[wait_key][scroll]overwhelm this land.[scroll]Before that happens[...][scroll]before it's too late[...] destroy[wait_key][scroll]the wizard before he destroys[scroll]all of Hyrule!  You can do it![scroll]You can[...]'''

[[message]]
id = 30
text = '''[player_name], be careful out there![line2]I know you can save Hyrule!'''

[[message]]
id = 31
text = '''[window 02][speed 03]Help me[...][wait 01][line3]Please help me[...][wait_key][scroll]I am a prisoner in the dungeon[scroll]of the castle.[scroll]My name is Zelda.[wait_key][scroll]The wizard, Agahnim, has done[...][scroll]something to the other missing[scroll]girls.  Now only I remain[...][wait_key][scroll]Agahnim has seized control of[scroll]the castle and is now trying to[scroll]open the seven wise men's[wait_key][scroll]seal.  [...]   [...][scroll]I am in the dungeon of the[scroll]castle.[wait_key][scroll]Please help me[...]'''

[[message]]
id = 32
text = '''[window 02][speed 03]Help me[...][line2]I am in the dungeon of the[line3]castle.[wait_key][scroll]I know there is a hidden path[scroll]from outside of  the castle to[scroll]the garden inside.'''

[[message]]
id = 33
text = '''There is a secret passage in[line2]the throne room that leads to[line3]Sanctuary.  I'm sure the old[wait_key][scroll]man there will help us.'''

[[message]]
id = 34
text = '''That ornamental shelf should[line2]open.  Do you have a light?[line3]It's pitch dark inside and you[wait_key][scroll]can't see without one.[scroll]If you're ready, let's go![scroll]Help me push it from the left!'''

[[message]]
id = 35
