[[message]]
id = 50
text = '''I am, indeed, Sahasrahla, the[line2]village elder and a descendent[line3]of the seven wise men.[wait_key][scroll][...]   [...]     Oh really?[scroll][player_name], I am surprised a young[scroll]man like you is searching for[wait_key][scroll]the sword of evil's bane.[scroll]Not just anyone can use that[scroll]weapon.  Legends say only the[wait_key][scroll]Hero who has won the three[scroll]Pendants can wield the sword.[scroll][...]   [...]   [...][wait_key][scroll]Do you really want to find it?[scroll]    > Yeah![scroll]       Of Course![choose]'''

[[message]]
id = 51
text = '''Good.  As a test, can you[line2]retrieve the Pendant Of[line3]Courage from the East Palace?[wait_key][scroll]If you bring it here, I will tell[scroll]you more of the legend and[scroll]give you a magical artifact.[sound 2d][wait_key][scroll]Now, go forward to the palace.'''

[[message]]
