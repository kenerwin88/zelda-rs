[[message]]
id = 43
text = '''Who? Oh, it's you, [player_name]![line2]What can I do for you, young[line3]man?  The elder?  Oh, no one[wait_key][scroll]has seen him since the wizard[scroll]began collecting victims[...][scroll][...]   [...]   [...][wait_key][scroll]What?  Master Sword?  Well, I[scroll]don't remember the details[scroll]exactly, but[...]'''

[[message]]
id = 44
text = '''Long ago, a prosperous people[line2]known as the Hylia inhabited[line3]this land[...][wait_key][scroll]Legends tell of many treasures[scroll]that the Hylia hid throughout[scroll]the land[...][wait_key][scroll]The Master Sword, a mighty[scroll]blade forged against those[scroll]with evil hearts, is one of[wait_key][scroll]them.  People say that now it[scroll]is sleeping deep in the forest[...][scroll][...] [...] [...][wait_key][scroll]Do you understand the legend?[scroll]    > Yes[scroll]       Not at all[choose]'''

[[message]]
id = 45
text = '''Anyway, look for the elder.[line2]There must be someone in the[line3]village who knows where he is.[wait_key][scroll]You take care now, [player_name][...]'''

[[message]]
id = 46
