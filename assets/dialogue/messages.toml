[[message]]
id = 36
text = '''All right,  let's get out of here[line2]before the wizard notices.  I[line3]know a secret path, but first[wait_key][scroll]we have to go to the[scroll]first floor.  Let's  go!'''

[[message]]
id = 37
text = '''[player_name], listen carefully.  The[line2]wizard is magically controlling[line3]all the soldiers in the castle.[wait_key][scroll]I fear the worst for[scroll]my father[...][scroll]The wizard is an inhuman fiend[wait_key][scroll]with strong magical powers![scroll][...]   [...]   [...][wait_key][scroll]Do you understand?[scroll]    > Yes[scroll]       Not at all[choose]'''

[[message]]
id = 38
text = '''You should follow the marks[line2]the elder made on your map[line3]when you explore.[wait_key][scroll]If you don't know what to do[scroll]next, you can also visit a[scroll]fortune teller.'''

[[message]]
id = 39
text = '''[player_name], you are wonderful![line2]As I thought, you have the[line3]power of the Hero inside you![wait_key][scroll]Now, you should get the Master[scroll]Sword.  I am confident that you[scroll]can defeat the evil wizard!'''

